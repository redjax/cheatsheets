[project]
site_name = "Cheatsheets"
site_description = "Command, application, language, and system reference sheets."

docs_dir = "cheatsheets"
site_dir = "zensical/site"
dev_addr = "127.0.0.1:8118"

## Use /dir/name instead of /dir/name/index.html
use_directory_urls = true

[project.theme]
language = "en"
## Disable requesting fonts from Google
font = false

features = [
    "navigation.sections",
    "navigation.expand",
    "navigation.top",
    "navigation.footer",
    "search.highlight",
    "toc.follow",
]

## Add support for syntax like > [!NOTE]
[project.markdown_extensions.pymdownx.quotes]
callouts = true

[project.markdown_extensions]
## Integrate Markdown tables
tables = {}
## Convert - [ ] and - [x] to checked boxes
pymdownx.tasklist.custom_checkbox = true
## Disable by setting to 0
toc.toc_depth = 3
toc.permalink = true

## Code fences
pymdownx.superfences = {}
## Syntax highlighting configuration for fenced and inline code.
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
